<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Compass / Navigation Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer radar ring -->
    <circle cx="40" cy="40" r="38" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="40" cy="40" r="30" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Stylized W / Compass Arrow -->
    <path d="M 18 26 L 30 62 L 40 38 L 50 62 L 62 26" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- North Arrow / Compass Needle in Amber -->
    <polygon points="40,14 44,36 36,36" fill="url(#amberGrad)" />
    <!-- Center pivot -->
    <circle cx="40" cy="40" r="3" fill="#ffffff" />
  </g>

  <!-- Typography: WAYNEX -->
  <text x="105" y="58" font-family="'Inter', -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="4" fill="#ffffff">
    WAY<tspan fill="#06b6d4">NEX</tspan>
  </text>
  
  <!-- Subtle Tagline -->
  <text x="107" y="77" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#818cf8">
    TRAVEL INTELLIGENCE
  </text>
</svg>
