<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#glow)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Mountainous / Architectural Silhouettes -->
  <path d="M0 600.0 Q 300.0 400.0 600.0 520.0 T 1200 480.0 L 1200 800 L 0 800 Z" fill="rgba(0,0,0,0.35)" />
  <path d="M0 656.0 Q 360.0 544.0 720.0 600.0 T 1200 576.0 L 1200 800 L 0 800 Z" fill="rgba(0,0,0,0.5)" />

  <!-- Central Crest Symbol -->
  <g transform="translate(1020.0, 200.0) scale(2.5)" stroke="#38bdf8" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65">
    <path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5m-4 0h4" />
  </g>

  <!-- Glass Card Plate for Typography -->
  <rect x="60" y="570" width="1080" height="170" rx="16" fill="rgba(3, 7, 18, 0.75)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- State Tag Badge -->
  <rect x="85" y="590" width="160" height="28" rx="6" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
  <text x="165" y="608" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.5">WAYNEX AUTHENTIC</text>

  <!-- Title & Subtitle -->
  <text x="85" y="665" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">Hampi Ruins & Mysuru Palace</text>
  <text x="85" y="705" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Vijayanagara Grandeur & Western Ghats &bull; Verified India Travel Intel</text>

  <!-- Official Seal Mark -->
  <circle cx="1080" cy="655" r="32" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="1080" y="659" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">100%</text>
  <text x="1080" y="647" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">WAYNEX</text>
  <text x="1080" y="671" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">VERIFIED</text>
</svg>